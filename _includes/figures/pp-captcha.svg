    <path d="M-7 0L-2 5L7 -5" class="diagram-check"/>
  </g>
  <text class="diagram-label diagram-small diagram-accent-text" x="222" y="122" text-anchor="middle">PASSED</text>
  <text class="diagram-label" x="150" y="266" text-anchor="middle">PROVE YOU'RE HUMAN</text>

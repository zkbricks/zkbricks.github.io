<svg class="figure-svg" viewBox="0 0 300 280" role="img" aria-label="A robot clicks the I'm not a robot checkbox of a CAPTCHA, and the check passes." fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- A bot ticks the "I'm not a robot" box and passes. -->
  <path d="M100 40V30" />
  <circle cx="100" cy="26" r="4" fill="var(--accent)" stroke="var(--accent)"/>
  <rect x="66" y="58" width="6" height="16" rx="2" class="diagram-body"/>
  <rect x="128" y="58" width="6" height="16" rx="2" class="diagram-body"/>
  <rect x="72" y="40" width="56" height="50" rx="9" fill="var(--paper)"/>
  <circle cx="88" cy="60" r="6" class="diagram-badge"/>
  <circle cx="112" cy="60" r="6" class="diagram-badge"/>
  <rect x="86" y="74" width="28" height="8" rx="2"/>
  <path d="M93 74V82M100 74V82M107 74V82"/>
  <path class="diagram-guide" d="M100 98C100 112 94 124 86 134" stroke-dasharray="2 6"/>
  <rect x="34" y="140" width="232" height="64" rx="4" fill="var(--paper)"/>
  <rect x="52" y="157" width="30" height="30" rx="3" class="diagram-badge"/>

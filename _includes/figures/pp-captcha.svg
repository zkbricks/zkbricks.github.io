  <text class="diagram-text" x="96" y="177" style="font-size:13.5px">I'm not a robot</text>
  <path d="M245 164A9 9 0 1 1 236 173" stroke="var(--muted)"/>
  <path d="M245 158V164H239" stroke="var(--muted)"/>
  <text class="diagram-label diagram-small chart-muted" x="258" y="196" text-anchor="end">CAPTCHA</text>
  <path d="M74 182L74 198L78.5 193.5L82 201L85 199.5L81.5 192.5L88 192.5Z" fill="var(--paper)"/>
  <g transform="translate(222 86)">
    <circle r="17" fill="var(--paper)" stroke="none"/>

<svg class="figure-svg" viewBox="0 0 540 330" role="img" aria-label="A website sees a verified human profile with a check mark. Behind the screen, the one typing is a dog wearing a verified tag and thinking: I'm human." fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

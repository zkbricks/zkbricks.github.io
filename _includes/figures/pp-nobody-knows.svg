  <path d="M350 262C350 222 372 190 400 190C428 190 450 222 450 262Z" fill="var(--paper)"/>
  <path d="M383 192Q400 201 417 192"/>
  <circle cx="400" cy="208" r="7" class="diagram-badge"/>
  <path d="M396.5 208L399 210.5L403.5 205.5" stroke="var(--accent)"/>
  <path d="M378 140C378 116 422 116 422 140C422 166 413 182 400 182C387 182 378 166 378 140Z" fill="var(--paper)"/>
  <path d="M382 128C366 124 358 148 363 170C372 168 378 158 381 146Z" class="diagram-body"/>
  <path d="M418 128C434 124 442 148 437 170C428 168 422 158 419 146Z" class="diagram-body"/>
  <circle cx="391" cy="145" r="2.4" fill="currentColor" stroke="none"/>
  <circle cx="409" cy="145" r="2.4" fill="currentColor" stroke="none"/>
  <ellipse cx="400" cy="164" rx="11" ry="9" fill="var(--paper)"/>
  <ellipse cx="400" cy="159.5" rx="4.5" ry="3.2" fill="currentColor" stroke="none"/>
  <path d="M395 168.5Q400 172 405 168.5"/>

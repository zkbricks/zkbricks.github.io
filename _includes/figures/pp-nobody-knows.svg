  <rect x="448" y="62" width="82" height="32" rx="16" fill="var(--paper)"/>
  <text class="diagram-label diagram-small" x="489" y="82" text-anchor="middle">I'M HUMAN</text>
  <text class="diagram-label" x="142" y="315" text-anchor="middle">WHAT THE SITE SEES</text>
  <text class="diagram-label diagram-accent-text" x="400" y="315" text-anchor="middle">WHO IS TYPING</text>
</svg>

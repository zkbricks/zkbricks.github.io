<svg class="figure-svg" viewBox="0 0 540 360" role="img" aria-label="Scatter plot of suppression against channel entropy for eight models with a 2-digit secret. Models that avoid their secret more leave the attacker with less uncertainty: Grok 4, Grok 4.1 Fast and GPT-5.4 nano sit at low suppression and about 11.5 bits, while Claude Opus 4.6 and Gemini 3.1 Pro sit at high suppression and about 4 bits. Spearman rank correlation 0.95." fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Suppression vs leakage at N = 2 (Figure 3, left, of the paper). Lower entropy means more leakage. -->
  <text class="diagram-label" x="58" y="12">CHANNEL ENTROPY (BITS) · LOWER MEANS MORE LEAKAGE</text>
  <path class="chart-grid" d="M58 262.632H516"/><text class="chart-text chart-muted" x="48" y="266.632" text-anchor="end">4</text>
  <path class="chart-grid" d="M58 207.895H516"/><text class="chart-text chart-muted" x="48" y="211.895" text-anchor="end">6</text>
  <path class="chart-grid" d="M58 153.158H516"/><text class="chart-text chart-muted" x="48" y="157.158" text-anchor="end">8</text>
  <path class="chart-grid" d="M58 98.4211H516"/><text class="chart-text chart-muted" x="48" y="102.421" text-anchor="end">10</text>
  <path class="chart-grid" d="M58 43.6842H516"/><text class="chart-text chart-muted" x="48" y="47.6842" text-anchor="end">12</text>
  <text class="chart-text chart-muted" x="58" y="310" text-anchor="middle">0</text>
  <text class="chart-text chart-muted" x="149.6" y="310" text-anchor="middle">0.2</text>
  <text class="chart-text chart-muted" x="241.2" y="310" text-anchor="middle">0.4</text>
  <text class="chart-text chart-muted" x="332.8" y="310" text-anchor="middle">0.6</text>
  <text class="chart-text chart-muted" x="424.4" y="310" text-anchor="middle">0.8</text>
  <text class="chart-text chart-muted" x="516" y="310" text-anchor="middle">1</text>
  <path class="chart-axis" d="M58 290H516"/>
  <path class="chart-ref" d="M58 190.379H516"/>
  <text class="chart-text chart-muted" x="516" y="183.379" text-anchor="end">No leakage (6.64 bits)</text>
  <text class="chart-text chart-muted" x="66" y="280">Spearman ρ = 0.95</text>
  <text class="diagram-label" x="287" y="340" text-anchor="middle">SUPPRESSION · HOW STRONGLY THE MODEL AVOIDS ITS SECRET</text>
  <g class="chart-point"><title>Grok 4.1 Fast: suppression 0.00, 11.56 bits</title><circle class="chart-hit" cx="59.8" cy="55.7" r="13"/><circle class="chart-dot" cx="59.8" cy="55.7" r="5"/><text class="chart-text" x="53.8" y="77.7" text-anchor="start">Grok 4.1 Fast</text></g>
  <g class="chart-point"><title>Grok 4: suppression 0.08, 11.80 bits</title><circle class="chart-hit" cx="92.8" cy="49.2" r="13"/><circle class="chart-dot" cx="92.8" cy="49.2" r="5"/><text class="chart-text" x="92.8" y="37.2" text-anchor="middle">Grok 4</text></g>
  <g class="chart-point"><title>GPT-5.4 nano: suppression 0.10, 11.53 bits</title><circle class="chart-hit" cx="102.0" cy="56.5" r="13"/><circle class="chart-dot" cx="102.0" cy="56.5" r="5"/><text class="chart-text" x="113.0" y="60.5" text-anchor="start">GPT-5.4 nano</text></g>
  <g class="chart-point"><title>Claude Sonnet 4.6: suppression 0.25, 10.22 bits</title><circle class="chart-hit" cx="173.0" cy="92.4" r="13"/><circle class="chart-dot" cx="173.0" cy="92.4" r="5"/><text class="chart-text" x="184.0" y="96.4" text-anchor="start">Claude Sonnet 4.6</text></g>
  <g class="chart-point"><title>Gemini 3.1 Flash-Lite: suppression 0.49, 8.66 bits</title><circle class="chart-hit" cx="280.6" cy="135.1" r="13"/><circle class="chart-dot" cx="280.6" cy="135.1" r="5"/><text class="chart-text" x="291.6" y="139.1" text-anchor="start">Gemini 3.1 Flash-Lite</text></g>
  <g class="chart-point"><title>GPT-5.4: suppression 0.69, 5.54 bits</title><circle class="chart-hit" cx="374.5" cy="220.5" r="13"/><circle class="chart-dot" cx="374.5" cy="220.5" r="5"/><text class="chart-text" x="385.5" y="224.5" text-anchor="start">GPT-5.4</text></g>
  <g class="chart-point"><title>Claude Opus 4.6: suppression 0.63, 4.18 bits</title><circle class="chart-hit" cx="348.4" cy="257.7" r="13"/><circle class="chart-dot" cx="348.4" cy="257.7" r="5"/><text class="chart-text" x="337.4" y="261.7" text-anchor="end">Claude Opus 4.6</text></g>
  <g class="chart-point"><title>Gemini 3.1 Pro: suppression 1.00, 3.42 bits</title><circle class="chart-hit" cx="516.0" cy="278.5" r="13"/><circle class="chart-dot" cx="516.0" cy="278.5" r="5"/><text class="chart-text" x="505.0" y="282.5" text-anchor="end">Gemini 3.1 Pro</text></g>
</svg>

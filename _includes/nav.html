{% assign nav_active = page.nav_active | default: '' %}
<header class="site-header" data-header>
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="zkBricks home">
      <span class="logo" aria-hidden="true"></span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu" data-menu-toggle>
      <span></span><span></span>
    </button>
    <nav class="nav" id="site-nav" aria-label="Main navigation">
      <ul class="nav-links">
        <li><a href="{{ '/research.html' | relative_url }}"{% if nav_active == 'research' %} aria-current="page"{% endif %}>Research</a></li>
        <li><a href="{{ '/blogs.html' | relative_url }}"{% if nav_active == 'blog' %} aria-current="page"{% endif %}>Blog</a></li>
        <li><a href="{{ '/team.html' | relative_url }}"{% if nav_active == 'team' %} aria-current="page"{% endif %}>Team</a></li>
        <li><a href="{{ '/contact.html' | relative_url }}"{% if nav_active == 'contact' %} aria-current="page"{% endif %}>Contact</a></li>
        <li><a href="https://github.com/zkbricks" target="_blank" rel="noopener noreferrer">GitHub <span class="arrow-ne" aria-hidden="true">↗</span></a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>

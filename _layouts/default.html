<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
  </head>
  <body class="page-{{ page.nav_active | default: 'page' }}">
    <a href="#main" class="skip-link">Skip to content</a>
    {% include nav.html %}
    <main id="main" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
  </body>
</html>
